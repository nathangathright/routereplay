# Cloudflare Worker: static assets + API + live-update Durable Object + D1.
# Local development: npm run dev:worker. Deploy: see docs/runbook.md.
name = "routereplay-web"
main = "src/server/worker.ts"
compatibility_date = "2026-11-01"
# The workers.dev address keeps serving too, so earlier links (and the old pages.dev redirect) still work.
routes = [{ pattern = "routereplay.video", custom_domain = true }]
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
# Unknown paths get public/404.html with a 404 status. The app's pages are /, which is index.html, and /s/* and /w/*,
# which the Worker serves from index.html with their own titles and status codes (src/server/index.ts).
not_found_handling = "404-page"
# Only these paths invoke the Worker; every other static file is served directly.
run_worker_first = [
  # The homepage, so the Worker can write in where the visitor is for the globe to start over (src/server/index.ts).
  "/",
  "/api/*",
  "/agent-docs",
  "/agent-docs.md",
  "/acknowledgments",
  "/llms.txt",
  "/schemas/*",
  "/s/*",
  "/w/*",
]

[[d1_databases]]
binding = "DB"
database_name = "routereplay"
database_id = "786bdf85-d8da-41c8-9efb-f2c4fd42bc1e"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "LIVE"
class_name = "SceneLive"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SceneLive"]

[vars]
# Canonical origin for generated links, whichever address a request arrives on. `npm run dev:worker` overrides it locally.
PUBLIC_ORIGIN = "https://routereplay.video"

# Workers AI, for POST /api/v1/compose (prototype). Local `wrangler dev` calls the remote models.
[ai]
binding = "AI"
