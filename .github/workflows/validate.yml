name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: skills/route-replay/scripts/requirements.txt
      - run: python3 -m pip install -r skills/route-replay/scripts/requirements.txt
      - run: python3 tools/list_skills.py
      - run: python3 tools/export_skill_repo.py --check
      - run: python3 tools/export_skill_repo.py --check-tracked
      - run: python3 -m compileall -q skills/route-replay/scripts tools
      - run: python3 tools/test_portable.py
