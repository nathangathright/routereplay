<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#02040a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Page not found · Route Replay</title>
    <!-- Served with a 404 status for any path that isn't a page or file (wrangler.toml not_found_handling). Styles match the app's .center-state. -->
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #02040a;
        color: #eef2f8;
        font: 16px/1.5 'Avenir Next', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        min-height: 60vh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 24px 16px;
      }
      h1 {
        font-size: 26px;
        margin: 0 0 8px;
      }
      p {
        color: #a3afc1;
        max-width: 48ch;
        margin: 0 auto 16px;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 10px 18px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        background: rgba(255, 255, 255, 0.06);
        color: #eef2f8;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      a:focus-visible {
        outline: 2px solid #2e8cff;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>Page not found</h1>
        <p>This address doesn’t match a Route Replay page.</p>
        <a href="/">Route Replay home</a>
      </div>
    </main>
  </body>
</html>
